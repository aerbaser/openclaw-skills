
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'ci-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  generic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: '{{SETUP_COMMAND}}'

      - name: Lint
        run: '{{LINT_COMMAND}}'

      - name: Typecheck
        run: '{{TYPECHECK_COMMAND}}'

      - name: Test
        run: '{{TEST_COMMAND}}'

      - name: Build
        run: '{{BUILD_COMMAND}}'
