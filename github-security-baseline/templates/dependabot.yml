
version: 2
updates:
  # Keep GitHub Actions references current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Replace or duplicate this block for the repo's real dependency ecosystem.
  # Common values:
  # - npm
  # - pip
  # - cargo
  # - gomod
  # - gradle
  # - maven
  # - bundler
  - package-ecosystem: '{{PRIMARY_ECOSYSTEM}}'
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
