
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'ci-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: '{{FORMAT_COMMAND}}'

      - name: Clippy
        run: '{{LINT_COMMAND}}'

      - name: Test
        run: '{{TEST_COMMAND}}'

      - name: Build
        run: '{{BUILD_COMMAND}}'
